services:
  - type: web
    name: shift-note
    runtime: docker
    plan: 1c-2g
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: shift-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SHIFT_ENV
        value: production
      - key: SHIFT_DB
        value: sqlite:////data/shift.db
      - key: SHIFT_PUBLIC_ORIGIN
        fromService:
          name: shift-note
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SHIFT_AUTH_SECRET
        generateValue: true
      - key: SHIFT_SETUP_TOKEN
        generateValue: true
      - key: PORT
        value: "8000"
